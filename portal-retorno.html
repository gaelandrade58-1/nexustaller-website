<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambios guardados — NexusTaller</title>
  <meta name="description" content="Tus cambios en la suscripción de NexusTaller quedaron guardados. Vuelve a la app.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f2ed;
      color: #1c2126;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ece8df;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(28, 33, 38, 0.08);
    }
    .check {
      width: 72px; height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #e7f6ec;
      color: #15803d;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700;
    }
    h1 { font-size: 26px; line-height: 1.25; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 12px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #020617;
      color: #ffffff;
      font-size: 17px; font-weight: 700;
      padding: 15px 32px;
      border-radius: 14px;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
    .note { font-size: 13px; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">NexusTaller</div>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Cambios guardados</h1>
    <p>Tus cambios en la suscripci&oacute;n quedaron guardados en el Portal
    del Cliente de Stripe.</p>
    <a class="btn" href="nexustaller://portal">Volver a NexusTaller</a>
    <p class="note">Al volver, la app refresca tu suscripci&oacute;n
    autom&aacute;ticamente.</p>
  </main>
</body>
</html>
