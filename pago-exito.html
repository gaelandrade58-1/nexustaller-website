<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso — NexusTaller</title>
  <meta name="description" content="Tu pago de NexusTaller se completó. Vuelve a la app para ver tu suscripción activa.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f2ed;
      color: #1c2126;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ece8df;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(28, 33, 38, 0.08);
    }
    .check {
      width: 72px; height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #e7f6ec;
      color: #15803d;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700;
    }
    h1 { font-size: 26px; line-height: 1.25; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 12px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #020617;
      color: #ffffff;
      font-size: 17px; font-weight: 700;
      padding: 15px 32px;
      border-radius: 14px;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
    .note { font-size: 13px; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">NexusTaller</div>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>&iexcl;Pago exitoso!</h1>
    <p>Tu suscripci&oacute;n a NexusTaller qued&oacute; activa. Ya puedes seguir
    gestionando tu taller sin interrupciones.</p>
    <p>Si la app no se abri&oacute; sola, pulsa el bot&oacute;n para volver:</p>
    <a class="btn" id="volverBtn" href="nexustaller://checkout?stripe_checkout=success">Volver a NexusTaller</a>
    <p class="note">Al volver a la app, tu suscripci&oacute;n se confirma
    autom&aacute;ticamente.</p>
  </main>
  <script>
    // La función pasa ?stripe_checkout=success&session_id=... en la URL.
    // El botón vuelve a la app con el deep link nexustaller:// y la misma
    // sesión, para que la app verifique el pago. La página en sí no verifica
    // nada: la confirmación autoritativa es el webhook de Stripe (que ya
    // activó la suscripción en Firestore) y la verificación que hace la app
    // al volver.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('session_id') || '';
      var href = 'nexustaller://checkout?stripe_checkout=success';
      if (sessionId) href += '&session_id=' + encodeURIComponent(sessionId);
      document.getElementById('volverBtn').setAttribute('href', href);
    })();
  </script>
</body>
</html>
