<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago cancelado — NexusTaller</title>
  <meta name="description" content="Cancelaste el pago de NexusTaller. No se realizó ningún cargo. Vuelve a la app cuando quieras.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f2ed;
      color: #1c2126;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ece8df;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(28, 33, 38, 0.08);
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #fef3c7;
      color: #b45309;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700;
    }
    h1 { font-size: 26px; line-height: 1.25; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 12px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #020617;
      color: #ffffff;
      font-size: 17px; font-weight: 700;
      padding: 15px 32px;
      border-radius: 14px;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
    .note { font-size: 13px; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">NexusTaller</div>
    <div class="icon" aria-hidden="true">&times;</div>
    <h1>Pago cancelado</h1>
    <p>No se realiz&oacute; ning&uacute;n cargo. Tu suscripci&oacute;n sigue como
    estaba y puedes intentarlo de nuevo cuando quieras.</p>
    <a class="btn" href="nexustaller://checkout?stripe_checkout=canceled">Volver a NexusTaller</a>
    <p class="note">Si ten&iacute;as una prueba gratis activa, sigue corriendo
    con normalidad.</p>
  </main>
</body>
</html>
